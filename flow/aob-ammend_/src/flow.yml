# The amendments to the Government of India (Allocation of Business) Rules, 1961 (orgpedia/doc: specs/aob.md §A5,
# and AoB Amendment Extraction – Requirements, "the ops spec"). Paths are relative to this file: the PDFs are
# ../input/, links into the collection's input/documents/aob-ammend/pdfs/. Settings are collection-wide; mistakes
# are found by checkers and fixed in the reviewer (edits in ../conf/), never by per-document settings.
# Outside data, pinned: the profiles (data/profiles/<version>.json; data/ is ../conf/data/).
data: {profiles: aob-1}

exclude: {}

flow:
  - name: import
    task: import_manifest
    config: {paths: ["../input/*.pdf"], portal: cabsec_aob, publisher: Cabinet Secretariat,
             sources: ../../../input/documents/aob-ammend/items.json, url_field: file_url}

  # The text layer (born-digital gazettes, 2017 on), read by pdfium: only the English is kept, and pdfium places
  # the words of the 2019-2020 gazettes, whose Hindi is set in a legacy font, where unipdf does not. A page
  # without a text layer (a scan: S.O. 2163(E) and 2164(E) of 2017) is read by Cloud Vision.
  - name: text
    task: ocr
    config: {engine: auto, ocr: gcv, languages: [eng, hin]}

  # Lines, then paragraphs in reading order. Only English stays in the flow: the Hindi half of a bilingual
  # gazette, and its running headers, are out of it. An amendment has no tables of its own. A page set in columns
  # (the gazettes before 2005) has no line running across a gutter.
  - name: lines
    task: word_lines
    config: {columns: true}
  - name: layout
    task: pdftable_finder
    config: {scripts: [LATIN], min_rows: 1000, columns: true}

  # A gazette issue (its masthead) and a notification at each "S.O. <n>(E).—"; one issue may hold
  # several amendments. A notification's id: its S.O. number and year, the year from the masthead's date or,
  # in a file cut from the middle of an issue (no masthead), from the notification's "New Delhi, the …". A file
  # with no "S.O." at all is the notification as signed, not the gazette's print (1_Upload_254, Series 214): it
  # starts at the enacting words, and its number and year are the listing's.
  - name: split
    task: section_splitter
    config:
      doc_type: gazette_issue
      ids: ["GOI_GAZETTE_EXT_{issue}_{year}"]
      listing: {path: ../../../input/documents/aob-ammend/items.json}
      captures:
        issue: {pattern: 'No\.\s*(?P<value>\d+)\s*\]'}
        year: {pattern: '(?i:NEW DELHI),[^\n]*?(?P<value>(?:19|20)\d\d)'}
        listed: {source: listing, field: gazette, pattern: 'S\.\s*O\.\s*(?P<value>\d+)'}
        listed_year: {source: listing, field: date, pattern: '(?P<value>(?:19|20)\d\d)'}
      parts:
        doc_type: aob_amendment
        start: '^\s*S\.\s*O\.\s*(?P<number>\d+)\s*\(\s*E\s*\)'
        start_else: '^\s*In exercise of the powers conferred by clause \(3\) of article 77'
        lead: false
        ids: ["GOI_SO_{number}E_{year}", "GOI_SO_{listed}E_{listed_year}"]

  # The ops (model-tagger.md): one answer per notification from Gemini 4 Argon, read by three steps: its
  # clauses and quoted text (roles), the provisions it cites (entities), and the changes (legal: relations
  # named after Akoma Ntoso's textualMod types). The prompt and the answer's shape are in prompts/.
  - name: ops_roles
    task: model_tagger
    applies_to: {doc_type: [aob_amendment]}
    context: {retries: 3}
    config: &ops
      provider: gemini
      model: gemini-4-argon
      thinking: low
      instructions: prompts/ops.md
      schema_file: prompts/ops.schema.json
      with_parent: true               # the issue's heading: the notification's date
      labels:
        notification: {layer: role, label: "gazette:notification_no", value: {from: number, type: text}}
        commencement: {layer: role, label: "legal:commencement", value: {from: date, type: date}}
        clauses: {layer: role, label: "core:division", value: {from: ref, type: text}}
        quoted: {layer: role, label: "core:quoted_text", target: lines}
        provisions: {layer: entity, label: "core:provision",
                     value: {from: path, into: path, add: {act: ACT_GOI_AOB_RULES_1961}, type: provision}}
        changes: {relation: "legal:{type}",
                  allowed: ["legal:insertion", "legal:repeal", "legal:replacement", "legal:substitution",
                            "legal:renumbering"],
                  args: {provision: targets, anchor: anchor, new_text: content, refers: refers},
                  values: [seq, clause_ref, position, scope, expect, old, new, new_num, flags],
                  stated_by: clause}
  - name: ops_provisions
    task: model_entities
    applies_to: {doc_type: [aob_amendment]}
    context: {retries: 3}
    config: *ops
  - name: ops
    task: model_relations
    applies_to: {doc_type: [aob_amendment]}
    context: {retries: 3}
    config: *ops

  # The ops spec's checks (§7): a clause saying "shall be" without a change, changes out of order or referring
  # to a later one, quoted words not in the text, and the model's flags, as aob: issues.
  - name: ops_check
    task: legal_ops_check
    applies_to: {doc_type: [aob_amendment]}
    config: {prefix: aob}

  # The ops spec's `amendment` object per notification (§3): output/<name>.json, each op pointing at its words
  # and boxes in the GovDoc file.
  - name: export
    task: amendment_export
    config: {dir: ../output, doc_types: [aob_amendment]}

  # The Rules' states' problems (../aob-states_/output/problems.json, specs/aob.md §A6) as aob: issues on the
  # changes they belong to: a person fixes the change in the studio, or dismisses the issue with a note, and the
  # states are built again. A problem in a part no change touched goes to the consolidated version instead.
  - name: states_check
    task: problems_check
    config: {problems: ../../aob-states_/output/problems.json, prefix: aob}
