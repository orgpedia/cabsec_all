# The Rules after each amendment (doc/aob.md §A6): from the consolidated version upto 301
# forward through the amendments' ops, checked against the consolidated versions. Paths are relative to
# this file.
product: rules_states
config:
  checkpoints: ../../aob-rules_/output
  amendments: ../../aob-ammend_/output
  checkpoint_items: [../../../input/documents/aob-rules/items.json, ../../aob-rules_/src/include.json]
  amendment_items: ../../../input/documents/aob-ammend/items.json
  start: 0                                # C1: from the Rules of 1961 (1_Upload_1144, aob-rules_'s include.json, upto 0); the
                                          # re-issues in 174 (1_Upload_212) and 271 (1_Upload_535) end C1 and C2 and start the
                                          # next (aob.md §A6)
  restarts: [301]                         # C3 ends at 1_Upload_910 (upto 301); phase B starts again from it
  schedules: ["1"]                        # phase C: Schedule 1 before Schedule 2 (the Order's problems always)
  out: ../output
  studio:                                 # where the First Schedule page's cells open the studio (one a collection)
    amendments: /#/aob-ammend             # the studio this page is served by (make studio in aob-ammend_)
    checkpoints: http://localhost:8801/#/aob-rules  # make studio PORT=8801 in aob-rules_
  evolution: [1_Upload_1144, 1_Upload_212, 1_Upload_535, 1_Upload_902, 1_Upload_1867, 1_Upload_3935, 1_Upload_4265]
                                          # the units over time, an epoch a version printed: the Rules of 1961, the
                                          # re-issues of 1985 and 2004, the versions after the elections of 2014, 2019
                                          # and 2024, the latest (versions/evolution.html)
  decisions: decisions.yml                # the calls on the inference rules (accepted, unreviewed, off; single cases
                                          # rejected; rules left out): versions/inferred.html
  known: known.yml                        # the known issues: what the basic checks still raise, each with why
                                          # (versions/known-issues.html; each document's lineage)
  renames:                                # a person's decisions, not the gazette's: a rename no amendment records
    - series: 135                         # 1977: the First Schedule (1_Upload_172) renamed it "Prime Minister's Office";
      schedule: 2                         # the Second Schedule kept "Prime Minister's Secretariat" until the 1985
      from: "PRIME MINISTER'S SECRETARIAT"  # re-issue printed "PRIME MINISTER'S OFFICE"
      to: "PRIME MINISTER'S OFFICE"
      to_hi: "PRADHAN MANTRI KARYALAYA"
      note: "decided by mukundesh, 21 Nov 2026: the Second Schedule follows the First's 1977 rename"
    - series: 88                          # 1971's Hindi-only First Schedule: the English name the June 1971 re-issue
      schedule: 1                         # (1_Upload_123) prints with this Hindi name
      from: "Banking Vibhag"
      to: "Department of Banking"
      to_hi: "Banking Vibhag"
      note: "English name from 1_Upload_123, decided by mukundesh, 21 Nov 2026"
    - series: 88                          # 1971's Hindi-only First Schedule: the English name the June 1971 re-issue
      schedule: 1                         # (1_Upload_123) prints with this Hindi name
      from: "Rajaswa Aur Bima Vibhag"
      to: "Department of Revenue and Insurance"
      to_hi: "Rajaswa Aur Bima Vibhag"
      note: "English name from 1_Upload_123, decided by mukundesh, 21 Nov 2026"
    - series: 88                          # 1971's Hindi-only First Schedule: the English name the June 1971 re-issue
      schedule: 1                         # (1_Upload_123) prints with this Hindi name
      from: "Sahkarita Vibhag"
      to: "Department of Cooperation"
      to_hi: "Sahkarita Vibhag"
      note: "English name from 1_Upload_123, decided by mukundesh, 21 Nov 2026"
    - series: 88                          # 1971's Hindi-only First Schedule: the English name the June 1971 re-issue
      schedule: 1                         # (1_Upload_123) prints with this Hindi name
      from: "Parivar Niyojan Vibhag"
      to: "Department of Family Planning"
      to_hi: "Parivar Niyojan Vibhag"
      note: "English name from 1_Upload_123, decided by mukundesh, 21 Nov 2026"
    - series: 88                          # 1971's Hindi-only First Schedule: the English name the June 1971 re-issue
      schedule: 1                         # (1_Upload_123) prints with this Hindi name
      from: "Shram Aur Rozgar Vibhag"
      to: "Department of Labour and Employment"
      to_hi: "Shram Aur Rozgar Vibhag"
      note: "English name from 1_Upload_123, decided by mukundesh, 21 Nov 2026"
    - series: 88                          # 1971's Hindi-only First Schedule: the English name the June 1971 re-issue
      schedule: 1                         # (1_Upload_123) prints with this Hindi name
      from: "Rasayan Vibhag"
      to: "Department of Chemicals"
      to_hi: "Rasayan Vibhag"
      note: "English name from 1_Upload_123, decided by mukundesh, 21 Nov 2026"
  page_skip: [88]                         # 1_Upload_122: its First Schedule in Hindi names alone, re-issued in English
                                          # a month later (89): left off the page, 89 compared with the states at 87
