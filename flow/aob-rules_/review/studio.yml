# GovDoc Studio for the consolidated versions (orgpedia/doc: specs/reviewer.md §R2; doc/aob.md here §A6). Paths are
# relative to this task's folder. `make studio` serves output/; edits go to conf/<file>.edits.yml. What is
# reviewed here: the Rules' states' problems in parts no amendment touched (states_check), each an issue on the
# version's words, fixed, dismissed with a note, or verified (the states take the version's text).
collection: aob-rules
title: Allocation of Business Rules — consolidated versions
profiles: conf/data/profiles/aob-rules-1.json
goal: [lines]
unit: aob_rules                           # one version at a time
levels: [document, blocks, lines, words]

documents:
  group_by: file
  sort: [Upto]                           # in the order of the amendments
  columns:                                # the last amendment each version takes in, its date
    - {label: Upto, from: export, field: upto,       # as the version prints it, else as the listing says
       fallback: {from: listing, listing: ../../input/documents/aob-rules/items.json, field: upto_amendment}}
    - {label: Date, from: listing, listing: ../../input/documents/aob-rules/items.json, field: date}
  issue_columns:                          # the open issues counted by the part they are about (studio.md §R3.1)
    - {label: Sch. 1, step: schedule 1}
    - {label: Sch. 2, step: schedule 2}
    - {label: Other}                      # the Order's rules, and issues on no part

issues:
  help: ../aob-ammend_/review/issues.html # what each code means, under the issue ("What this means")
  see: [input, ../aob-ammend_/input]  # where the PDFs an issue names are: opened from its links
  categories:                             # code -> category; the panel groups issues by the stage found at
    old: ["aob:old_upto_ahead", "aob:old_upto_same"]  # old listed under the wrong upto (aob.md §A6)
    new: ["aob:new_text_differs", "aob:new_missing", "aob:new_extra", "aob:new_renumbered",
             "aob:new_hindi_differs"]  # expected new
  verify:                                 # a difference the version is right about, no amendment made: the states
    label: Take the version's text        # take the version's text there from then on (aob.md §A6)
    codes: ["aob:new_text_differs", "aob:new_missing", "aob:new_extra", "aob:new_renumbered",
             "aob:new_hindi_differs"]

run:                                      # Run, and r (reviewer.md §R8): after the flow on the files with edits,
  then:                                   # what follows from them, as `make refresh` in flow/ does
    - product: ../aob-states_/src/states.yml  # the Rules' states and their problems
    - flow: .                             # this task's states_check on every file
    - flow: ../aob-ammend_                # the other task's
