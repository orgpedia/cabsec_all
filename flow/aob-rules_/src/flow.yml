# The consolidated versions of the Government of India (Allocation of Business) Rules, 1961, from 2016 on
# (orgpedia/doc: specs/aob.md §A5): the checkpoints. Paths are relative to this file: the PDFs are ../input/,
# links into the collection's input/documents/aob-rules/pdfs/. Settings are collection-wide.
data: {profiles: aob-rules-1}

# Set aside for now: a scan whose text is someone else's OCR laid under the page images ("lFFCO", "U)" for "(j)",
# footnote numbers full size), about 500 differences at 319-320; the version upto 320 checks 318-320 instead. To be
# read again by OCR when the ocr task can ignore such a hidden layer (phase C).
exclude:
  1_Upload_886.pdf: "a scan with a poor hidden OCR layer: set aside until it can be read again by OCR"
  # listed upto 299 and 300, but made later (2012-03-02, 2014-08-21) and printing the next amendments' changes
  # (300's Department of Electronics and Information Technology; 301's two Social Justice departments): 913 is
  # 910 (upto 301) word for word
  1_Upload_915.pdf: "made after amendment 300 and prints its change: not the version upto 299 it is listed as"
  1_Upload_913.pdf: "the same text as 1_Upload_910 (upto 301), made in 2014: not the version upto 300 it is listed as"
  # another printing of the same version: one is kept, the latest (the states' choice)
  1_Upload_1896.pdf: "the same text as 1_Upload_1901 (upto 351, the same day)"
  1_Upload_3511.pdf: "an earlier printing of upto 370; 1_Upload_3540 (the same day) corrects it"
  1_Upload_3517.pdf: "an earlier printing of upto 370; 1_Upload_3540 (the same day) corrects it"

flow:
  - name: import
    task: import_manifest
    config: {paths: ["../input/*.pdf"], portal: cabsec_aob_rules, publisher: Cabinet Secretariat,
             sources: [../../../input/documents/aob-rules/items.json, include.json], url_field: file_url}
  # include.json: what the website does not list as versions but is one, the schedules re-issued whole (Series
  # 174 and 271), and a schedule substituted alone (217), each with the amendment it holds and why

  # The text layer, read by pdfium; a footnote's number printed as a superscript is a word of its own.
  - name: text
    task: ocr
    config: {engine: textlayer_super}

  # Lines, and a block per page: the export reads the lines in order. A page set in columns (the re-issue of 1985)
  # is read column by column, no line running across a gutter.
  - name: lines
    task: word_lines
    config: {columns: true}
  - name: layout
    task: page_blocks
    config: {columns: true}

  # A version is one document: the Rules as amended up to a date.
  - name: split
    task: one_document
    config: {doc_type: aob_rules, id_prefix: "GOI_AOB_RULES_1961@"}

  # The version read into its tree of parts and its footnotes (output/<name>.json).
  - name: export
    task: rules_export
    config: {dir: ../output, doc_types: [aob_rules]}

  # The Rules' states' problems in parts no amendment touched (../aob-states_/output/problems.json, specs/aob.md
  # §A6), as aob: issues on the version's words: a misreading, or the compilers' own correction, dismissed with
  # a note in the studio.
  - name: states_check
    task: problems_check
    config: {problems: ../../aob-states_/output/problems.json, prefix: aob}
