# The Rules after each amendment (orgpedia/doc: specs/aob.md §A6): from the consolidated version upto 301
# forward through the amendments' ops, checked against the consolidated versions. Paths are relative to
# this file.
product: rules_states
config:
  checkpoints: ../../aob-rules_/output
  amendments: ../../aob-ammend_/output
  checkpoint_items: [../../../input/documents/aob-rules/items.json, ../../aob-rules_/src/include.json]
  amendment_items: ../../../input/documents/aob-ammend/items.json
  start: 0                                # C1: from the Rules of 1961 (1_Upload_1144, aob-rules_'s include.json, upto 0); the
                                          # re-issues in 174 (1_Upload_212) and 271 (1_Upload_535) end C1 and C2 and start the
                                          # next (aob.md §A6)
  restarts: [301]                         # C3 ends at 1_Upload_910 (upto 301); phase B starts again from it
  schedules: ["1"]                        # phase C: Schedule 1 before Schedule 2 (the Order's problems always)
  out: ../output
  studio:                                 # where the First Schedule page's cells open the studio (one a collection)
    amendments: /#/aob-ammend             # the studio this page is served by (make studio in aob-ammend_)
    checkpoints: http://localhost:8801/#/aob-rules  # make studio PORT=8801 in aob-rules_
  evolution: [1_Upload_1144, 1_Upload_212, 1_Upload_535, 1_Upload_902, 1_Upload_1867, 1_Upload_3935, 1_Upload_4265]
                                          # the units over time, an epoch a version printed: the Rules of 1961, the
                                          # re-issues of 1985 and 2004, the versions after the elections of 2014, 2019
                                          # and 2024, the latest (versions/evolution.html)
  page_skip: [88]                         # 1_Upload_122: its First Schedule in Hindi names alone, re-issued in English
                                          # a month later (89): left off the page, 89 compared with the states at 87
