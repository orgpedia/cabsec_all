# Kept by a person, read on every run (requirements R18, ui-requirements U19, U22, U29). Units are named by their
# name as the data prints it, so this file serves both cells.yml (from 1961) and cells-2004.yml.
# DRAFT 0.1 for Mukund's review, November 21, 2026.

