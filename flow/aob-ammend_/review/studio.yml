# GovDoc Studio for the amendments task (orgpedia/doc: specs/reviewer.md §R2; specs/aob.md §A5, step 1a).
# Paths are relative to this task's folder. `make studio` serves output/; edits go to conf/<file>.edits.yml.
collection: aob-ammend
title: Allocation of Business Rules — amendments
profiles: conf/data/profiles/aob-1.json
goal: [fields, relations]
unit: aob_amendment                       # one notification at a time; its gazette issue is the context
levels: [relations, document, fields, blocks, lines, words]

documents:                                # the documents screen
  group_by: file
  sort: [Series]                           # in the order of the amendments
  chain: ../aob-states_/output/chain.json  # in the header: the version applied to › the amendment › the version it gives
  versions: ../aob-states_/output/versions # the generated versions, the Rules after each series: linked from the chain
  columns:
    - {label: Series, from: listing, listing: ../../input/documents/aob-ammend/items.json, field: source_key,
       match: {field: gazette, role: "gazette:notification_no"}}  # one file, two notifications: each its own
    - {label: S.O., role: "gazette:notification_no"}
    - {label: In force, role: "legal:commencement"}

record:
  aob_amendment:
    header: ["gazette:notification_no", "legal:commencement"]
    sections: ["core:division", "core:quoted_text"]

relations:                                # the Relations level: each change a card, in the order numbered
  title: Changes
  labels: [legal:insertion, legal:repeal, legal:replacement, legal:substitution, legal:renumbering]
  names: {insertion: insert, repeal: omit, replacement: replace, substitution: substitute text, renumbering: renumber}
  number: seq                             # the card's number, and the order
  order_by: seq
  ref: clause_ref                         # the clause as printed: 2(i)
  paths: [provision, anchor]              # arguments whose annotation's value is a path: edited as steps
  path_label: core:provision
  text: [new_text]                        # arguments shown as their printed lines: the quoted text
  text_label: core:quoted_text
  values: [seq, clause_ref, position, scope, expect, old, new, new_num]
  step_kinds: [schedule, rule, sub_rule, ministry, department, group_heading, entry, entry_range, item, note, proviso,
               explanation, paragraph]
  bare_steps: [note, proviso, explanation, paragraph]  # named by their kind alone: "in entry 4, in the Note"; a
                                                       # heading's one unnumbered entry, "the existing entry"
  layout:                                 # shown as what is there now and what goes in (old and new)
    old: {at: provision, as_changed_by: refers, "{scope|text}": expect, words: old}
    new: {"{position}": anchor, as_changed_by: refers, "{scope|parts}": new_text, words: new, num: new_num}
  step_names: {group_heading: part}       # a "PART I" heading line, shown as part I
  states: ../aob-states_/output/changes.json  # each change's part before and after it, with the versions' pages

issues:
  help: review/issues.html            # what each code means, under the issue ("What this means")
  see: [input, ../aob-rules_/input]   # where the PDFs an issue names are: opened from its links
  categories:                             # code -> category; the panel groups issues by category, by the stage
    read: ["aob:read_quote_mismatch", "aob:read_clause_missed", "aob:read_sequence",  # found at (aob.md §A6):
           "aob:read_path_unsure", "aob:read_page_break", "aob:read_hindi_missing",  # reading the amendment
           "core:model_unanchored", "core:model_invalid"]
    old: ["aob:old_path_missing", "aob:old_path_ambiguous", "aob:old_quote_mismatch",  # applying it to old
          "aob:old_words_missing", "aob:old_already_omitted", "aob:old_ref_missing", "aob:old_op_unknown",
          "aob:old_upto_ahead", "aob:old_upto_same"]
    states: ["aob:states_path_missing", "aob:states_path_ambiguous", "aob:states_quote_mismatch",  # to the states
             "aob:states_words_missing", "aob:states_already_omitted", "aob:states_ref_missing",
             "aob:states_op_unknown"]
    new: ["aob:new_text_differs", "aob:new_missing", "aob:new_extra", "aob:new_hindi_differs"]  # expected new
  verify:                                 # a difference the version is right about, no amendment made: the states
    label: Take the version's text        # take the version's text there from then on (aob.md §A6)
    codes: ["aob:new_text_differs", "aob:new_missing", "aob:new_extra", "aob:new_hindi_differs"]
  collapse: [info]

run:                                      # Run, and r (reviewer.md §R8): after the flow on the files with edits,
  then:                                   # what follows from them, as `make refresh` in flow/ does
    - product: ../aob-states_/src/states.yml  # the Rules' states and their problems
    - flow: .                             # this task's states_check on every file
    - flow: ../aob-rules_                 # the other task's
