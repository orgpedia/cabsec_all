# spelling: a name as the data prints it, shown as it should read. For a misread or run-on heading in the states'
# First Schedule that a re-issue later mends; the states should be fixed too (aob.md §A11), and the line here then
# goes. Each with the series it is seen in.
spelling:
  # 120–134: 1_Upload_157 (S.O. 291(E), 1977), "Affaus"
  "Ministry of Home Affaus": "Ministry of Home Affairs"
  # 167–173: the commas lost in the reading
  "Ministry of Personnel and Training Administrative Reforms and Public Grievances and Pension": "Ministry of Personnel and Training, Administrative Reforms and Public Grievances and Pensions"
  # 217–231: S.O. 452(E) of 1991's First Schedule; its Hindi name without "Mantralaya"
  "Ministry of Law, Justice and Company Affairs (Vidhi, Nyaya aur Kampani Karya)": "Ministry of Law, Justice and Company Affairs"
  # 217: a word broken at a line's end
  "Ministry of Planning and Programme Implementa tion": "Ministry of Planning and Programme Implementation"
  # 5–216: the Railway Board printed with the name, three ways
  "Ministry of Railways (Railway Board)": "Ministry of Railways"
  "Ministry of Railways Railway Board": "Ministry of Railways"
  "Ministry of Railways Railway Board (Rail Board)": "Ministry of Railways"

# events: a call on an event, by its key ("<series> <kind> <short name>", as in cells-2004.json's events[].key):
#   keep | drop | <another kind>, or {salient: true, caption: "…"} for the Story and the video (ui-requirements U10).
# 16 salient events, 2004–2021. Captions are short, plain and factual; each shows on screen for about 4 seconds.
events:
  "272 merged Coal and Mines":
    salient: true
    caption: "Coal and Mines merge into one ministry."
  "273 absorbed Disinvestment":
    salient: true
    caption: "The Ministry of Disinvestment is folded into Finance."
  "277 split Coal and Mines":
    salient: true
    caption: "Eleven months later, Coal and Mines part again."
  "283 spun_off Women & Child":
    salient: true
    caption: "Women and Child Development becomes a ministry of its own, out of HRD."
  "283 spun_off Minority Affairs":
    salient: true
    caption: "Minority Affairs is carved out of Social Justice."
  "310 split Skills, Youth & Sports":
    salient: true
    caption: "Skills and Sports, joined in July, divide in December."
  "310 spun_off AYUSH":
    salient: true
    caption: "AYUSH buds off Health and Family Welfare."
  "312 ended Planning Commission":
    salient: true
    caption: "The Planning Commission is abolished…"
  "312 born NITI Aayog":
    salient: true
    caption: "…and NITI Aayog is created in its place."
  "321 absorbed Overseas Indian Affairs":
    salient: true
    caption: "Overseas Indian Affairs folds into External Affairs."
  "327 split Communications & IT":
    salient: true
    caption: "Communications and IT divide: Electronics & IT becomes a ministry."
  "350 absorbed Drinking Water and Sanitation":
    salient: true
    caption: "Drinking Water and Sanitation folds into Water Resources…"
  "350 renamed Water Resources & Ganga":
    salient: true
    caption: "…which is renamed the Ministry of Jal Shakti."
  "350 spun_off Fisheries & Dairying":
    salient: true
    caption: "Fisheries, Animal Husbandry and Dairying leaves Agriculture."
  "356 renamed Human Resource Development":
    salient: true
    caption: "Human Resource Development is renamed Education."
  # 1961–2003 (draft, November 22, 2026)
  "5 split Steel, Mines & Fuel":
    salient: true
    caption: "Steel, Mines and Fuel divides into Mines and Fuel, and Steel and Heavy Industries."
  "17 split Commerce & Industry":
    salient: true
    caption: "Commerce and Industry divides: International Trade and Industry become ministries of their own."
  "46 merged Labour, Employment and Rehabilitation":
    salient: true
    caption: "Labour and Employment, and Rehabilitation, merge into one ministry."
  "95 born Space":
    salient: true
    caption: "The Department of Space is created."
  "146 spun_off Environment":
    salient: true
    caption: "A Department of Environment is carved out of Science and Technology."
  "174 split Irrigation and Power":
    salient: true
    caption: "In the 1985 re-issue, Irrigation and Power divides into Water Resources and Energy."
  "188 split Transport":
    salient: true
    caption: "Transport divides into Surface Transport and Civil Aviation."
  "217 split Energy":
    salient: true
    caption: "Energy divides into Power and Non-Conventional Energy Sources, and Coal."
  "243 born Tribal Affairs":
    salient: true
    caption: "A Ministry of Tribal Affairs is created."
  "243 split Planning and Programme Implementation":
    salient: true
    caption: "Planning and Programme Implementation divides: Statistics and Programme Implementation, and Planning."
  "256 born North East":
    salient: true
    caption: "A Department of Development of North Eastern Region is created."
  "257 merged Communications & IT":
    salient: true
    caption: "Communications and Information Technology merge into one ministry."
  # 2004–2026
  "362 spun_off Cooperation":
    salient: true
    caption: "A new Ministry of Cooperation is carved out of Agriculture."

