  -3: {<<: *y1947, U015: 20, U021: 15}
  -2: {U005: 42, U009: 62, P01: 62, U003: 17, U006: 70, U004: 31, P02: 80, U007: 65, U012: 39, U008: 77,
       U013: 29, U010: 23, P03: 16, U018: 20, U015: 20, U021: 15, U022: 6, U023: 1, U024: 1,
       U001: 77, U019: 25, U017: 24, U025: 45}
